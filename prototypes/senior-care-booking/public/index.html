<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B4F8A">
  <title>Puducherry Senior Care: Doctor appointments</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#screen">Skip to main content</a>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="52" height="52">
      <div>
        <div class="brand-name" id="brandName">Puducherry Senior Care</div>
        <div class="brand-sub" id="brandSub">Doctor appointments for senior citizens</div>
      </div>
    </div>
    <div class="settings" role="group" aria-label="Settings">
      <button class="pill" id="langBtn" type="button"></button>
      <button class="pill" id="voiceBtn" type="button" aria-pressed="true"></button>
      <div class="sizes" role="group" id="sizeGroup">
        <button class="pill size" data-scale="1" type="button" aria-label="Normal text">A</button>
        <button class="pill size" data-scale="1.15" type="button" aria-label="Large text">A+</button>
        <button class="pill size" data-scale="1.3" type="button" aria-label="Largest text">A++</button>
      </div>
    </div>
  </header>

  <p class="banner" id="banner"></p>

  <div class="status" id="status" role="status" aria-live="assertive" hidden></div>

  <main id="screen" tabindex="-1" aria-live="polite"></main>

  <nav class="bottom" id="bottomBar" aria-label="Help">
    <button class="btn ghost" id="backBtn" type="button"></button>
    <button class="btn ghost" id="micBtn" type="button" hidden></button>
    <button class="btn ghost" id="hearBtn" type="button"></button>
  </nav>

  <script src="i18n.js"></script>
  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
